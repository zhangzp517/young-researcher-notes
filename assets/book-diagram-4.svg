<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-label="一段探索怎样引出下一段研究"><rect width="900" height="540" fill="#f7f5ee"/><style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,sans-serif;fill:#29452f}.heading{font-size:27px;font-weight:600}.label{font-size:23px}.detail{font-size:18px;fill:#5d675d}</style><text x="450" y="49" text-anchor="middle" class="heading">一段探索怎样引出下一段研究</text><rect x="60" y="80" width="780" height="78" rx="10" fill="#e6ebdf"/><text x="90" y="111" class="label">观察差别</text><text x="90" y="139" class="detail">比较多源文本与单一文本</text><path d="M450 162v15m-5-5 5 5 5-5" fill="none" stroke="#70836a" stroke-width="2"/><rect x="60" y="185" width="780" height="78" rx="10" fill="#e6ebdf"/><text x="90" y="216" class="label">辨认来源</text><text x="90" y="244" class="detail">进一步比较不同来源的作用</text><path d="M450 267v15m-5-5 5 5 5-5" fill="none" stroke="#70836a" stroke-width="2"/><rect x="60" y="290" width="780" height="78" rx="10" fill="#e6ebdf"/><text x="90" y="321" class="label">解释差别</text><text x="90" y="349" class="detail">追问为何更好，以及在什么条件下成立</text><path d="M450 372v15m-5-5 5 5 5-5" fill="none" stroke="#70836a" stroke-width="2"/><rect x="60" y="395" width="780" height="78" rx="10" fill="#e6ebdf"/><text x="90" y="426" class="label">继续探索</text><text x="90" y="454" class="detail">根据已有结果提出下一项独立问题</text></svg>