<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-label="合作中的方向、阶段与表达"><rect width="900" height="540" fill="#f7f5ee"/><style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,sans-serif;fill:#29452f}.heading{font-size:27px;font-weight:600}.label{font-size:23px}.detail{font-size:18px;fill:#5d675d}</style><text x="450" y="49" text-anchor="middle" class="heading">合作中的方向、阶段与表达</text><rect x="60" y="80" width="780" height="78" rx="10" fill="#e6ebdf"/><text x="90" y="111" class="label">开始：形成共同理解</text><text x="90" y="139" class="detail">明确问题、目标、分工与初步方法</text><path d="M450 162v15m-5-5 5 5 5-5" fill="none" stroke="#70836a" stroke-width="2"/><rect x="60" y="185" width="780" height="78" rx="10" fill="#e6ebdf"/><text x="90" y="216" class="label">探索：学习怎样进入对象</text><text x="90" y="244" class="detail">理解方法为什么适用，解释自己的尝试</text><path d="M450 267v15m-5-5 5 5 5-5" fill="none" stroke="#70836a" stroke-width="2"/><rect x="60" y="290" width="780" height="78" rx="10" fill="#e6ebdf"/><text x="90" y="321" class="label">中期：检查研究方向</text><text x="90" y="349" class="detail">根据实际结果辨认是否偏离最初问题</text><path d="M450 372v15m-5-5 5 5 5-5" fill="none" stroke="#70836a" stroke-width="2"/><rect x="60" y="395" width="780" height="78" rx="10" fill="#e6ebdf"/><text x="90" y="426" class="label">后期：让成果可以被理解</text><text x="90" y="454" class="detail">整理表达、材料与复现依据</text></svg>