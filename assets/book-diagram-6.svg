<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-label="理论与现实在研究问题处相遇"><rect width="900" height="540" fill="#f7f5ee"/><style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,sans-serif;fill:#29452f}.heading{font-size:27px;font-weight:600}.label{font-size:23px}.detail{font-size:18px;fill:#5d675d}</style><text x="450" y="49" text-anchor="middle" class="heading">理论与现实在研究问题处相遇</text><rect x="60" y="80" width="780" height="78" rx="10" fill="#e6ebdf"/><text x="90" y="111" class="label">理论聚焦</text><text x="90" y="139" class="detail">学科基础、人文视野、科学方法论 → 领域理论</text><path d="M450 162v15m-5-5 5 5 5-5" fill="none" stroke="#70836a" stroke-width="2"/><rect x="60" y="185" width="780" height="78" rx="10" fill="#e6ebdf"/><text x="90" y="216" class="label">研究问题</text><text x="90" y="244" class="detail">理论解释与现实材料共同收敛</text><path d="M450 267v15m-5-5 5 5 5-5" fill="none" stroke="#70836a" stroke-width="2"/><rect x="60" y="290" width="780" height="78" rx="10" fill="#e6ebdf"/><text x="90" y="321" class="label">现实提炼</text><text x="90" y="349" class="detail">业界实践、政策与时代趋势 → 数据与调研</text><path d="M450 372v15m-5-5 5 5 5-5" fill="none" stroke="#70836a" stroke-width="2"/><rect x="60" y="395" width="780" height="78" rx="10" fill="#e6ebdf"/><text x="90" y="426" class="label">反复校正</text><text x="90" y="454" class="detail">材料检验解释；理论辨认发现的意义</text></svg>