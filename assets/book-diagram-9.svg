<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-label="个体完善与团队进化"><rect width="900" height="540" fill="#f7f5ee"/><style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,sans-serif;fill:#29452f}.heading{font-size:27px;font-weight:600}.label{font-size:23px}.detail{font-size:18px;fill:#5d675d}</style><text x="450" y="49" text-anchor="middle" class="heading">个体完善与团队进化</text><rect x="60" y="80" width="780" height="78" rx="10" fill="#e6ebdf"/><text x="90" y="111" class="label">个人尝试</text><text x="90" y="139" class="detail">探索工具和工作方法，发现问题</text><path d="M450 162v15m-5-5 5 5 5-5" fill="none" stroke="#70836a" stroke-width="2"/><rect x="60" y="185" width="780" height="78" rx="10" fill="#e6ebdf"/><text x="90" y="216" class="label">共同讨论</text><text x="90" y="244" class="detail">解释经验及其适用条件，接受反馈</text><path d="M450 267v15m-5-5 5 5 5-5" fill="none" stroke="#70836a" stroke-width="2"/><rect x="60" y="290" width="780" height="78" rx="10" fill="#e6ebdf"/><text x="90" y="321" class="label">同伴使用</text><text x="90" y="349" class="detail">借鉴、修改，再带回新的发现</text><path d="M450 372v15m-5-5 5 5 5-5" fill="none" stroke="#70836a" stroke-width="2"/><rect x="60" y="395" width="780" height="78" rx="10" fill="#e6ebdf"/><text x="90" y="426" class="label">持续调整</text><text x="90" y="454" class="detail">个人经验进入团队，团队经验支持个人</text></svg>