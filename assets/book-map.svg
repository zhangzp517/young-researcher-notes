<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1590" viewBox="0 0 720 1590" role="img" aria-labelledby="title desc"><title id="title">全书思维图谱</title><desc id="desc">从研究判断到能力培养，再到个人实践；按阅读顺序列出十一章大意。</desc><rect width="720" height="1590" fill="#f7f5ee"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="32" y="40" font-size="28" fill="#273a37" font-weight="bold">全书思维图谱</text><rect x="24" y="60" width="672" height="62" rx="12" fill="#e4ede7" stroke="none"/><text x="46" y="99" font-size="24" fill="#273a37" font-weight="bold">怎样形成自己的判断，并持续把事情做好</text><rect x="24" y="146" width="672" height="454" rx="12" fill="#ffffff" stroke="#d8ddd5"/><text x="44" y="181" font-size="25" fill="#315f58" font-weight="bold">第一编　形成自己的研究</text><text x="44" y="211" font-size="19" fill="#59655f" font-weight="normal">选题判断 → 现实问题 → 可信论证 → 长期积累</text><text x="48" y="247" font-size="21" fill="#315f58" font-weight="bold">第一章　为什么值得研究</text><text x="48" y="277" font-size="20" fill="#273a37" font-weight="normal">辨认值得投入的问题，明确方向，集中力量。</text><text x="48" y="339" font-size="21" fill="#315f58" font-weight="bold">第二章　让问题与现实相遇</text><text x="48" y="369" font-size="20" fill="#273a37" font-weight="normal">理解实际流程，使问题、数据与决策相接。</text><text x="48" y="431" font-size="21" fill="#315f58" font-weight="bold">第三章　把探索变成可信的知识</text><text x="48" y="461" font-size="20" fill="#273a37" font-weight="normal">讲清数据含义、推理依据与研究贡献。</text><text x="48" y="523" font-size="21" fill="#315f58" font-weight="bold">第四章　形成长期积累</text><text x="48" y="553" font-size="20" fill="#273a37" font-weight="normal">让项目彼此接续，在使用AI时积累判断能力。</text><text x="36" y="636" font-size="20" fill="#59655f" font-weight="normal">↓ 自己的研究判断，怎样成为学生可以学习的能力？</text><rect x="24" y="670" width="672" height="454" rx="12" fill="#ffffff" stroke="#d8ddd5"/><text x="44" y="705" font-size="25" fill="#52678a" font-weight="bold">第二编　帮助学生成为研究者</text><text x="44" y="735" font-size="19" fill="#59655f" font-weight="normal">培养目标 → 独立能力 → 日常训练 → 团队成长</text><text x="48" y="771" font-size="21" fill="#52678a" font-weight="bold">第五章　培养怎样的人</text><text x="48" y="801" font-size="20" fill="#273a37" font-weight="normal">兼顾做事能力与独立判断，明确培养目标。</text><text x="48" y="863" font-size="21" fill="#52678a" font-weight="bold">第六章　独立能力怎样长出来</text><text x="48" y="893" font-size="20" fill="#273a37" font-weight="normal">以高标准为参照，按起点提供帮助，逐步独立。</text><text x="48" y="955" font-size="21" fill="#52678a" font-weight="bold">第七章　在阅读、写作与反馈中训练</text><text x="48" y="985" font-size="20" fill="#273a37" font-weight="normal">通过阅读、写作、反馈与汇报练习研究判断。</text><text x="48" y="1047" font-size="21" fill="#52678a" font-weight="bold">第八章　让团队成为成长的环境</text><text x="48" y="1077" font-size="20" fill="#273a37" font-weight="normal">明确共同目标与个人责任，让经验成为共同能力。</text><text x="36" y="1160" font-size="20" fill="#59655f" font-weight="normal">↓ 承担研究与育人，个人怎样选择并持续投入？</text><rect x="24" y="1194" width="672" height="362" rx="12" fill="#ffffff" stroke="#d8ddd5"/><text x="44" y="1229" font-size="25" fill="#88603b" font-weight="bold">第三编　在做事中成为自己</text><text x="44" y="1259" font-size="19" fill="#59655f" font-weight="normal">方向选择 → 行动调整 → 持续投入</text><text x="48" y="1295" font-size="21" fill="#88603b" font-weight="bold">第九章　选择自己的路</text><text x="48" y="1325" font-size="20" fill="#273a37" font-weight="normal">分清热情与身份期待，连接日常进展和长期意义。</text><text x="48" y="1387" font-size="21" fill="#88603b" font-weight="bold">第十章　投入、取舍与自我觉察</text><text x="48" y="1417" font-size="20" fill="#273a37" font-weight="normal">用取舍、自问、提醒和练习，把理解转成行动。</text><text x="48" y="1479" font-size="21" fill="#88603b" font-weight="bold">第十一章　给长期行动留下生活空间</text><text x="48" y="1509" font-size="20" fill="#273a37" font-weight="normal">接受时间与精力的限度，为工作和生活保留余量。</text></g></svg>